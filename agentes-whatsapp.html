const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

const { useEffect, useState } = React;

function Page() {
  useEffect(() => { if (window.lucide) window.lucide.createIcons(); });
  const [layout, setLayout] = useState(() => localStorage.getItem('mayam-projects-layout') || 'grid');
  const [projects, setProjects] = useState(null);

  useEffect(() => { localStorage.setItem('mayam-projects-layout', layout); }, [layout]);

  useEffect(() => {
    sb.from('agent_projects')
      .select('*')
      .eq('service', 'agentes-whatsapp')
      .eq('status', 'published')
      .order('sort_order', { ascending: true })
      .then(({ data }) => {
        if (data && data.length > 0)
          setProjects(data.map((p, idx) => ({ ...p, idx, metricLabel: p.metric_label || '' })));
        else
          setProjects(makeProjects('agentes-whatsapp', 6));
      });
  }, []);

  const displayProjects = projects || makeProjects('agentes-whatsapp', 6);

  return (
    <>
      <Header active="agentes-whatsapp.html" />
      <main>
        <ServiceHero
          eyebrow="Agentes WhatsApp"
          icon="message-circle"
          title="Agentes que conversan,"
          titleAccent="entienden y resuelven."
          description="Diseñamos, integramos y operamos agentes conversacionales para WhatsApp Business. Multimodales, conectados a tus sistemas y con guardrails para producción."
          bullets={[
            'WhatsApp Business API oficial (BSP certificado)',
            'Voz, texto, imagen y documentos en una conversación',
            'Integración con CRM, ERP, agenda y motor de pagos',
            'Calificación de leads + handover a humano sin fricción',
            'Métricas de conversación, latencia y NPS desde día uno',
          ]}
        />
        <ServiceFeatures
          title="Cómo construimos cada agente"
          subtitle="Más allá de un bot de respuestas. Un trabajador digital que ejecuta tareas dentro de tu operación."
          features={[
            { icon: 'workflow', title: 'Diseño conversacional', desc: 'Flujos por intención + escalamiento, no árboles rígidos. Hablamos como tus clientes hablan.' },
            { icon: 'database', title: 'Datos y memoria', desc: 'RAG sobre tu base de conocimiento. El agente recuerda al cliente y aprende de cada interacción.' },
            { icon: 'shield-check', title: 'Guardrails y ética', desc: 'Filtros, redacción de PII y políticas de qué SÍ y qué NO puede decir el agente. Auditables.' },
            { icon: 'plug', title: 'Integraciones reales', desc: 'HubSpot, Zoho, Pipedrive, Salesforce, Google Calendar, Stripe, Conekta y endpoints propios.' },
            { icon: 'mic', title: 'Multimodal nativo', desc: 'Voz a texto, lectura de fotos de documentos y respuesta con audio cuando aplica.' },
            { icon: 'activity', title: 'Operación y mejora', desc: 'Monitoreo continuo, evaluación de respuestas y ciclos de mejora cada 2 semanas.' },
          ]}

      <Footer />
      <WhatsAppFloat />
      <AdminProjectPanel sb={sb} service="agentes-whatsapp" onProjectsChange={setProjects} />
