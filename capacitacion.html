<script type="text/babel">
const SUPABASE_URL  = 'https://wbujrdnolbdcleejnrft.supabase.co';
const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndidWpyZG5vbGJkY2xlZWpucmZ0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk3MTUzNTUsImV4cCI6MjA5NTI5MTM1NX0.vkzxEe7tvbXwQOOYGYKEJbsXQ-HOAobxnB-PRxOpkCc';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

const { useEffect, useState } = React;
function Page() {
  useEffect(() => { if (window.lucide) window.lucide.createIcons(); });
  const [layout, setLayout] = useState(() => localStorage.getItem('mayam-projects-layout') || 'grid');
  const [projects, setProjects] = useState(null);
  useEffect(() => { localStorage.setItem('mayam-projects-layout', layout); }, [layout]);

  useEffect(() => {
    sb.from('agent_projects')
      .select('*')
      .eq('service', 'capacitacion')
      .eq('status', 'published')
      .order('sort_order', { ascending: true })
      .then(({ data }) => {
        if (data && data.length > 0)
          setProjects(data.map((p, idx) => ({ ...p, idx, metricLabel: p.metric_label || '' })));
        else
          setProjects(makeProjects('capacitacion', 6));
      });
  }, []);

  const displayProjects = projects || makeProjects('capacitacion', 6);

  return (
    <>
      <Header active="capacitacion.html" />
      <main>
        <ServiceHero
          eyebrow="Capacitación corporativa"
          icon="graduation-cap"
          title="No solo enseñamos IA."
          titleAccent="Hacemos que se use."
          description="Programas in-company para que la tecnología baje del PowerPoint a la operación. Conferencias, talleres por área y AI Coaches implant que acompañan al equipo durante meses."
          bullets={[
            'Conferencias para liderazgo y kick-offs corporativos',
            'Talleres prácticos por área: ventas, marketing, finanzas, RH',
            'Programas in-company de 3 a 6 meses',
            'AI Coach implant: mentoría 1:1 dentro de tu empresa',
            'Currícula a medida con casos reales del negocio',
          ]}
        />
        <ServiceFeatures
          title="Formatos que se adaptan a tu organización"
          subtitle="Para que la IA no quede en quien fue al curso, sino en cómo trabaja todo el equipo."
          features={[
            { icon: 'mic', title: 'Conferencias ejecutivas', desc: 'Sesiones de 60–90 min para C-level y mandos medios. Casos por industria, no demos genéricas.' },
            { icon: 'users', title: 'Talleres por área', desc: 'Hands-on de medio día o jornada completa. Cada área se lleva 5 prompts y 2 flujos listos.' },
            { icon: 'route', title: 'Programas in-company', desc: 'Currícula de 3–6 meses con cohortes, métricas de adopción y entregables por sprint.' },
            { icon: 'user-check', title: 'AI Coach implant', desc: 'Una persona MAYAM dentro de tu empresa, 2–4 días por semana, durante 90 días.' },
            { icon: 'scroll-text', title: 'Material a medida', desc: 'Manuales, prompts y plantillas con la voz, el caso y los procesos de tu empresa.' },
            { icon: 'gauge', title: 'Medición de adopción', desc: 'No medimos asistencia. Medimos uso real en el día a día y resultados por equipo.' },
          ]}
        />
        <ProjectsSection projects={displayProjects} layout={layout} setLayout={setLayout} />
      </main>
      <Footer />
      <WhatsAppFloat />
      <AdminProjectPanel sb={sb} service="capacitacion" onProjectsChange={setProjects} />
    </>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Page />);
</script>
