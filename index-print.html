<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MAYAM — Sitio web (versión imprimible)</title>
  <meta name="description" content="Versión imprimible del sitio MAYAM (home + 4 servicios + nosotros + contacto)." />
  <link rel="stylesheet" href="assets/base.css" />
  <style>
    /* Force colors and disable hover/animations for print */
    * {
      -webkit-print-color-adjust: exact !important;
      print-color-adjust: exact !important;
    }
    html, body { margin: 0; padding: 0; background: #fff; }

    /* Hide chrome that doesn't make sense in print */
    .mayam-header,
    .mayam-whatsapp-float,
    .mayam-footer-back-to-top { display: none !important; }

    /* Each captured page */
    .print-page {
      break-before: page;
      page-break-before: always;
      break-inside: avoid-page;
    }
    .print-page:first-of-type {
      break-before: auto;
      page-break-before: auto;
    }

    /* Cover */
    .print-cover {
      min-height: 100vh;
      background: var(--mayam-blue);
      color: #fff;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 80px 72px;
      position: relative;
      overflow: hidden;
      page-break-after: always;
      break-after: page;
    }
    .print-cover::after {
      content: 'Y';
      position: absolute;
      right: -6rem; bottom: -10rem;
      font-family: var(--font-display);
      font-size: 50rem;
      font-weight: 700;
      color: #fff;
      opacity: 0.06;
      line-height: 1;
    }
    .print-cover-eyebrow {
      font-size: 14px;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      font-weight: 600;
      opacity: 0.85;
    }
    .print-cover h1 {
      font-family: var(--font-display);
      font-size: 96px;
      font-weight: 600;
      letter-spacing: -0.025em;
      line-height: 1;
      margin: 24px 0 0 0;
      color: #fff;
      max-width: 900px;
    }
    .print-cover h1 em {
      font-style: italic; font-weight: 400; opacity: 0.92;
    }
    .print-cover-meta {
      display: flex; justify-content: space-between; align-items: flex-end;
      gap: 40px; flex-wrap: wrap;
      position: relative;
      font-size: 14px;
      color: rgba(255,255,255,0.85);
    }
    .print-cover-meta strong { color: #fff; display: block; font-size: 22px; font-weight: 600; margin-bottom: 6px; letter-spacing: -0.005em; }
    .print-cover-tagline {
      font-family: var(--font-display);
      font-style: italic;
      font-size: 26px;
      font-weight: 400;
      opacity: 0.9;
    }

    /* TOC */
    .print-toc {
      padding: 80px 72px;
      page-break-after: always;
      break-after: page;
    }
    .print-toc h2 {
      font-family: var(--font-display);
      font-size: 56px;
      font-weight: 600;
      letter-spacing: -0.02em;
      margin: 0 0 8px 0;
    }
    .print-toc-sub { color: var(--fg-muted); font-size: 16px; margin-bottom: 56px; max-width: 600px; }
    .print-toc ol { list-style: none; padding: 0; margin: 0; counter-reset: toc; }
    .print-toc li {
      counter-increment: toc;
      display: grid;
      grid-template-columns: 80px 1fr 80px;
      align-items: baseline;
      padding: 18px 0;
      border-top: 1px solid var(--border);
      font-size: 22px;
      font-weight: 500;
    }
    .print-toc li:last-child { border-bottom: 1px solid var(--border); }
    .print-toc li::before {
      content: counter(toc, decimal-leading-zero);
      font-family: var(--font-mono);
      font-size: 14px;
      letter-spacing: 0.1em;
      color: var(--mayam-blue);
      font-weight: 600;
    }
    .print-toc li .toc-page {
      text-align: right;
      font-family: var(--font-mono);
      font-size: 14px;
      color: var(--fg-muted);
    }
    .print-toc li .toc-sub {
      display: block;
      font-size: 13px;
      color: var(--fg-muted);
      font-weight: 400;
      margin-top: 4px;
    }

    /* Page header for each rendered page */
    .print-pageheader {
      display: flex; justify-content: space-between; align-items: center;
      padding: 24px 72px 16px;
      border-bottom: 1px solid var(--border);
      font-size: 11px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--fg-muted);
      font-weight: 600;
    }
    .print-pageheader-brand { color: var(--mayam-blue); }

    .print-pagebody {
      padding: 0;
    }

    /* Container override for print */
    @media print {
      @page { size: Letter; margin: 0.5in; }
      .print-page { padding: 0 !important; }
      /* Avoid breaking inside cards */
      article, .section-header, h1, h2, h3 { break-inside: avoid; }
      /* Avoid the floating WA */
      .mayam-whatsapp-float, [aria-label="Hablar por WhatsApp"] { display: none !important; }
    }
    @media screen {
      body {
        background: #ececec;
      }
      .print-page, .print-cover, .print-toc {
        max-width: 8.5in;
        margin: 24px auto;
        background: #fff;
        box-shadow: 0 6px 30px rgba(0,0,0,0.08);
      }
    }

    /* Section spacing tight in print */
    .section { padding: 56px 0 !important; }
    .container { padding-left: 48px; padding-right: 48px; }
  </style>
</head>
<body>

function PrintTOC() {

function PrintPageWrap({ page, children }) {

function App() {

  return (
    <>
      <PrintCover />
      <PrintTOC />
      <PrintPageWrap page={PAGES[0]}><HomeRender /></PrintPageWrap>
      <PrintPageWrap page={PAGES[1]}><ServiceWAReader /></PrintPageWrap>
      <PrintPageWrap page={PAGES[2]}><ServiceCapRender /></PrintPageWrap>
      <PrintPageWrap page={PAGES[3]}><ServiceVideoRender /></PrintPageWrap>
      <PrintPageWrap page={PAGES[4]}><ServiceConsRender /></PrintPageWrap>
      <PrintPageWrap page={PAGES[5]}><AboutRender /></PrintPageWrap>
      <PrintPageWrap page={PAGES[6]}><ContactRender /></PrintPageWrap>
    </>

}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);

// Auto-print after fonts and rendering are ready
(async () => {
  try { if (document.fonts && document.fonts.ready) await document.fonts.ready; } catch {}
  setTimeout(() => {
    if (window.lucide) window.lucide.createIcons();
    setTimeout(() => window.print(), 600);
  }, 1200);
})();
</script>
