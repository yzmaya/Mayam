/* Normaliza un post de Supabase al formato que usa el componente */
function normalizeDbPost(p) {
  return {
    id: p.id,
    category: p.category,
    categoryIcon: p.category_icon || 'file-text',
    title: p.title,
    excerpt: p.excerpt || '',
    author: p.author_name,
    date: p.published_at
      ? new Date(p.published_at).toLocaleDateString('es-MX', { day: 'numeric', month: 'long', year: 'numeric' })
      : '',
    rawDate: p.published_at || p.created_at,
    readTime: `${p.read_time_minutes || 3} min de lectura`,
    image: p.image_url || '',
    featured: p.featured,
    content: Array.isArray(p.content) ? p.content : [],
  };
}

/* ── Helpers ── */
function AuthorAvatar({ name, size = 40 }) {
  const initials = name.split(' ').map(w => w[0]).join('').slice(0, 2).toUpperCase();
  return (
    <div style={{
      width: size, height: size, borderRadius: '50%',
      background: 'var(--blue-100)', color: 'var(--mayam-blue)',
      display: 'grid', placeItems: 'center',
      fontWeight: 600, fontSize: size * 0.38, flexShrink: 0,
      border: '2px solid var(--blue-200)',
    }}>
      {initials}
    </div>
  );
}

function CategoryBadge({ label, icon }) {
  useEffect(() => { if (window.lucide) window.lucide.createIcons(); });
  return (
    <span style={{
      display: 'inline-flex', alignItems: 'center', gap: 6,
      fontSize: 11, fontWeight: 600, letterSpacing: '0.12em', textTransform: 'uppercase',
      color: 'var(--mayam-blue)', background: 'var(--blue-050)',
      padding: '5px 11px', borderRadius: 999,
    }}>
      <i data-lucide={icon} style={{ width: 12, height: 12 }}></i>
      {label}
    </span>
  );
}

/* ── Blog Modal ── */
function BlogModal({ post, onClose }) {
  useEffect(() => {
    if (!post) return;
    function onKey(e) { if (e.key === 'Escape') onClose(); }
    document.addEventListener('keydown', onKey);
    document.body.style.overflow = 'hidden';
    return () => {
      document.removeEventListener('keydown', onKey);
      document.body.style.overflow = '';
    };
  }, [post, onClose]);

  useEffect(() => {
    if (post && window.lucide) window.lucide.createIcons();
  }, [post]);

  if (!post) return null;

  return (
    <div
      role="dialog"
      aria-modal="true"
      aria-labelledby="blog-modal-title"
      onClick={onClose}
      style={{
        position: 'fixed', inset: 0, zIndex: 100,
        background: 'rgba(10, 18, 36, 0.60)',
        backdropFilter: 'blur(10px)',
        WebkitBackdropFilter: 'blur(10px)',
        display: 'grid', placeItems: 'center',
        padding: 24,
        animation: 'mayam-fade-in 200ms cubic-bezier(0.2,0,0,1)',
      }}
    >
      <div
        onClick={e => e.stopPropagation()}
        style={{
          width: '100%', maxWidth: 1100, maxHeight: '92vh',
          background: '#fff', borderRadius: 22, overflow: 'hidden',
          display: 'flex', flexDirection: 'row',
          boxShadow: '0 40px 90px rgba(0,0,0,0.38)',
          animation: 'mayam-pop-in 280ms cubic-bezier(0.2,0,0,1.05)',
        }}
        className="blog-modal-inner"
      >
        {/* Left: imagen */}
        <div style={{ position: 'relative', overflow: 'hidden', flex: '0 0 420px', minHeight: 0 }}>
          <img
            src={post.image}
            alt={post.title}
            style={{ width: '100%', height: '100%', objectFit: 'cover', display: 'block' }}
            onError={e => { e.target.style.display = 'none'; e.target.parentNode.style.background = 'var(--blue-900)'; }}
          />
          <div style={{
            position: 'absolute', inset: 0,
            background: 'linear-gradient(to top, rgba(0,28,80,0.88) 0%, rgba(0,28,80,0.15) 55%, transparent 100%)',
          }} />
          <div style={{ position: 'absolute', bottom: 0, left: 0, right: 0, padding: 32 }}>
            <div style={{ marginBottom: 14 }}>
              <CategoryBadge label={post.category} icon={post.categoryIcon} />
            </div>
            <div style={{ display: 'flex', alignItems: 'center', gap: 12 }}>
              <AuthorAvatar name={post.author} size={38} />
              <div>
                <div style={{ fontSize: 14, fontWeight: 600, color: '#fff' }}>{post.author}</div>
                <div style={{ fontSize: 12, color: 'rgba(255,255,255,0.75)', marginTop: 2 }}>
                  {post.date} · {post.readTime}
                </div>
              </div>
            </div>
          </div>
        </div>

        {/* Right: contenido */}
        <div style={{ display: 'flex', flexDirection: 'column', overflowY: 'auto', minWidth: 0, flex: 1 }}>
          {/* Header barra */}
          <div style={{
            display: 'flex', justifyContent: 'space-between', alignItems: 'center',
            padding: '20px 36px 0',
            position: 'sticky', top: 0, background: '#fff', zIndex: 2,
            borderBottom: '1px solid var(--border)', paddingBottom: 16,
          }}>
            <span style={{ fontSize: 11, fontWeight: 600, letterSpacing: '0.18em', textTransform: 'uppercase', color: 'var(--mayam-blue)' }}>
              Blog MAYAM
            </span>
            <button
              onClick={onClose}
              aria-label="Cerrar"
              style={{
                width: 38, height: 38, borderRadius: '50%',
                border: '1px solid var(--border)', background: '#fff',
                cursor: 'pointer', display: 'grid', placeItems: 'center',
                color: 'var(--fg-muted)',
                transition: 'all 150ms',
              }}
            >
              <i data-lucide="x" style={{ width: 17, height: 17 }}></i>
            </button>
          </div>

          {/* Cuerpo del artículo */}
          <div style={{ padding: '32px 36px 40px', flex: 1 }}>
            <h2
              id="blog-modal-title"
              style={{
                fontSize: 'clamp(20px, 2vw, 26px)',
                fontWeight: 600, lineHeight: 1.2, letterSpacing: '-0.015em',
                color: 'var(--neutral-900)', margin: '0 0 28px 0',
              }}
            >
              {post.title}
            </h2>

            {post.content.map((block, i) => {
              if (block.type === 'lead') return (
                <p key={i} style={{ fontSize: 16, lineHeight: 1.75, color: 'var(--fg)', margin: '0 0 24px 0', fontWeight: 400 }}>
                  {block.text}
                </p>
              );
              if (block.type === 'paragraph') return (
                <p key={i} style={{ fontSize: 15, lineHeight: 1.7, color: 'var(--fg)', margin: '0 0 20px 0' }}>
                  {block.text}
                </p>
              );
              if (block.type === 'subheading') return (
                <h3 key={i} style={{ fontSize: 15, fontWeight: 600, letterSpacing: '0.04em', color: 'var(--neutral-800)', margin: '28px 0 16px 0', textTransform: 'uppercase', letterSpacing: '0.1em' }}>
                  {block.text}
                </h3>
              );
              if (block.type === 'bullets') return (
                <div key={i} style={{ display: 'flex', flexDirection: 'column', gap: 16, margin: '0 0 28px 0' }}>
                  {block.items.map((item, j) => (
                    <div key={j} style={{
                      display: 'flex', gap: 14, alignItems: 'flex-start',
                      padding: '16px 18px', borderRadius: 12,
                      background: 'var(--neutral-050)', border: '1px solid var(--border)',
                    }}>
                      <div style={{
                        width: 34, height: 34, borderRadius: 8, flexShrink: 0,
                        background: 'var(--blue-050)', color: 'var(--mayam-blue)',
                        display: 'grid', placeItems: 'center',
                      }}>
                        <i data-lucide={item.icon} style={{ width: 16, height: 16 }}></i>
                      </div>
                      <div>
                        <div style={{ fontSize: 13, fontWeight: 600, color: 'var(--neutral-800)', marginBottom: 4 }}>{item.label}</div>
                        <div style={{ fontSize: 14, color: 'var(--fg-muted)', lineHeight: 1.6 }}>{item.text}</div>
                      </div>
                    </div>
                  ))}
                </div>
              );
              if (block.type === 'question') return (
                <div key={i} style={{
                  borderLeft: '3px solid var(--mayam-blue)',
                  paddingLeft: 20, margin: '28px 0 0 0',
                  color: 'var(--fg-strong)', fontSize: 15, lineHeight: 1.65,
                  fontStyle: 'italic',
                }}>
                  {block.text}
                </div>
              );
              return null;
            })}
          </div>

          {/* Footer del modal */}
          <div style={{
            padding: '20px 36px 28px',
            borderTop: '1px solid var(--border)',
            display: 'flex', gap: 12, flexWrap: 'wrap',
            position: 'sticky', bottom: 0, background: '#fff',
          }}>
            <a href="contacto.html" className="btn btn-primary" style={{ flex: '1 1 auto', justifyContent: 'center' }}>
              Contactar a MAYAM
              <i data-lucide="arrow-right" style={{ width: 16, height: 16 }}></i>
            </a>
            <button onClick={onClose} className="btn btn-secondary">
              Seguir leyendo
            </button>
          </div>
        </div>
      </div>

      <style>{`
        @keyframes mayam-fade-in { from { opacity: 0; } to { opacity: 1; } }
        @keyframes mayam-pop-in {
          from { opacity: 0; transform: translateY(18px) scale(0.97); }
          to   { opacity: 1; transform: translateY(0) scale(1); }
        }
        @media (max-width: 900px) {
          .blog-modal-inner { flex-direction: column !important; max-height: 92vh; overflow-y: auto; }
          .blog-modal-inner > div:first-child { flex: 0 0 auto !important; min-height: 280px !important; }
          .blog-modal-inner > div:last-child { flex: 0 0 auto !important; overflow-y: visible !important; }
        }
      `}</style>
    </div>
  );
}

}

/* ── Blog Grid (con estado + fetch Supabase) ── */
function BlogSection() {
  const [openPost, setOpenPost] = useState(null);
  const [query, setQuery] = useState('');
  const [activeCategory, setActiveCategory] = useState('Todos');
  const [posts, setPosts] = useState(FALLBACK_POSTS);
  const [loading, setLoading] = useState(true);

  useEffect(() => {
    sb.from('blog_posts')
      .select('*')
      .eq('status', 'published')
      .order('published_at', { ascending: false })
      .then(({ data }) => {
        if (data && data.length > 0) setPosts(data.map(normalizeDbPost));
        setLoading(false);
      })
      .catch(() => setLoading(false));
  }, []);

  const ALL_CATEGORIES = ['Todos', ...Array.from(new Set(posts.map(p => p.category)))];

  const filtered = posts.filter(p => {
    const q = query.toLowerCase();
    const matchesQuery = !q || p.title.toLowerCase().includes(q) || p.excerpt.toLowerCase().includes(q) || p.category.toLowerCase().includes(q);
    const matchesCat = activeCategory === 'Todos' || p.category === activeCategory;
    return matchesQuery && matchesCat;
  });

  /* El post con featured=true va primero; si no hay, el más reciente */
  const sortedFiltered = [...filtered].sort((a, b) => (b.featured ? 1 : 0) - (a.featured ? 1 : 0));
  const [featured, ...rest] = sortedFiltered;

  return (
    <>
      <SearchBar query={query} onQuery={setQuery} activeCategory={activeCategory} onCategory={setActiveCategory} allCategories={ALL_CATEGORIES} />

      <section className="section">
        <div className="container">
          {loading ? (
            <div style={{ textAlign: 'center', padding: '80px 0', color: 'var(--fg-muted)' }}>
              <div style={{ fontSize: 36, marginBottom: 12 }}>⏳</div>
              <p style={{ fontSize: 15 }}>Cargando artículos…</p>
            </div>
          ) : filtered.length === 0 ? (
            <div style={{ textAlign: 'center', padding: '80px 0', color: 'var(--fg-muted)' }}>
              <div style={{ fontSize: 48, marginBottom: 16 }}>🔍</div>
              <h3 style={{ fontSize: 20, fontWeight: 600, color: 'var(--neutral-700)', marginBottom: 8 }}>Sin resultados</h3>
              <p style={{ fontSize: 15 }}>
                No encontramos artículos con "{query}". Intenta con otra palabra clave.
              </p>
              <button
                onClick={() => { setQuery(''); setActiveCategory('Todos'); }}
                className="btn btn-secondary"
                style={{ marginTop: 24 }}
              >
                Limpiar filtros
              </button>
            </div>
          ) : (
            <div>
              {featured && (
                <div style={{ marginBottom: 48 }}>
                  <BlogCard post={featured} featured onOpen={setOpenPost} />
                </div>
              )}
              {rest.length > 0 && (
                <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(300px, 1fr))', gap: 28 }}>
                  {rest.map(post => <BlogCard key={post.id} post={post} onOpen={setOpenPost} />)}
                </div>
              )}
            </div>
          )}
        </div>
      </section>

      <BlogModal post={openPost} onClose={() => setOpenPost(null)} />
    </>
  );
}

const NEWSLETTER_URL = 'https://script.google.com/macros/s/AKfycbwa3bed3F5X7SYgQDby2nY1PZRQbUl8NjW4HR-KtkcTsghdfbCffcOWjDuTh89OyCxwOQ/exec';

/* ── Newsletter ── */
function NewsletterBlog() {
  const [email,  setEmail]  = React.useState('');
  const [status, setStatus] = React.useState('idle'); // idle | loading | done

  const onSubmit = async (e) => {
    e.preventDefault();
    setStatus('loading');
    try {
      const res  = await fetch(NEWSLETTER_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: new URLSearchParams({ email, source: 'blog' }).toString(),
      });
      const data = await res.json();
      setStatus(data.status === 'duplicate' ? 'duplicate' : 'done');
    } catch (_) {
      setStatus('done');
    }
  };

  return (
    <section style={{ background: 'var(--neutral-050)', borderTop: '1px solid var(--border)', padding: '72px 0' }}>
      <div className="container" style={{ maxWidth: 680, textAlign: 'center' }}>
        <span className="eyebrow" style={{ marginBottom: 16, display: 'block' }}>Mantente al tanto</span>
        <h2 style={{ fontSize: 'clamp(24px, 3.5vw, 38px)', fontWeight: 600, letterSpacing: '-0.015em', margin: '0 0 14px 0' }}>
          Nuevos artículos directo a tu correo
        </h2>
        <p style={{ fontSize: 16, color: 'var(--fg-muted)', lineHeight: 1.6, margin: '0 0 34px 0' }}>
          Publicamos análisis sobre IA, estrategia y liderazgo tecnológico. Sin spam, solo contenido que vale tu tiempo.
        </p>
        {status === 'done' || status === 'duplicate' ? (
          <div style={{
            display: 'inline-flex', alignItems: 'center', gap: 12,
            padding: '16px 28px', borderRadius: 12,
            background: status === 'duplicate' ? 'var(--neutral-050)' : 'var(--blue-050)',
            border: `1px solid ${status === 'duplicate' ? 'var(--border)' : 'var(--blue-100)'}`,
          }}>
            <div style={{
              width: 34, height: 34, borderRadius: '50%',
              background: status === 'duplicate' ? 'var(--fg-muted)' : 'var(--mayam-blue)',
              color: '#fff', display: 'grid', placeItems: 'center', flexShrink: 0,
            }}>
              <i data-lucide={status === 'duplicate' ? 'info' : 'check'} style={{ width: 17, height: 17, strokeWidth: 2.5 }}></i>
            </div>
            <span style={{ fontSize: 16, fontWeight: 600, color: status === 'duplicate' ? 'var(--fg-strong)' : 'var(--mayam-blue)' }}>
              {status === 'duplicate'
                ? 'Este correo ya está suscrito.'
                : '¡Listo! Te avisamos con cada artículo nuevo.'}
            </span>
          </div>
        ) : (
          <form onSubmit={onSubmit} style={{ display: 'flex', gap: 12, flexWrap: 'wrap', justifyContent: 'center' }}>
            <input
              type="email"
              placeholder="tu@empresa.com"
              value={email} onChange={e => setEmail(e.target.value)}
              required disabled={status === 'loading'}
              style={{
                flex: '1 1 260px', padding: '13px 18px', borderRadius: 10,
                border: '1px solid var(--border-strong)', fontSize: 15,
                outline: 'none', fontFamily: 'var(--font-sans)', color: 'var(--fg-strong)',
                opacity: status === 'loading' ? 0.6 : 1,
              }}
            />
            <button type="submit" className="btn btn-primary" style={{ whiteSpace: 'nowrap' }} disabled={status === 'loading'}>
              {status === 'loading' ? 'Enviando…' : 'Suscribirme'}
            </button>
          </form>
        )}
      </div>
    </section>
  );
}
