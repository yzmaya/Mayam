<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Consultoría en IA · MAYAM</title>
  <meta name="description" content="Asesoría estratégica para definir cómo, dónde y con qué adoptar IA en tu empresa." />
  <link rel="stylesheet" href="assets/base.css" />
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>

<script type="text/babel" src="components/Shared.jsx"></script>
<script type="text/babel" src="components/ShaderBg.jsx"></script>
<script type="text/babel" src="components/Service.jsx"></script>
<script type="text/babel" src="components/Admin.jsx"></script>

<script type="text/babel">
const SUPABASE_URL  = 'https://wbujrdnolbdcleejnrft.supabase.co';
const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndidWpyZG5vbGJkY2xlZWpucmZ0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk3MTUzNTUsImV4cCI6MjA5NTI5MTM1NX0.vkzxEe7tvbXwQOOYGYKEJbsXQ-HOAobxnB-PRxOpkCc';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

const { useEffect, useState } = React;
function Page() {
  useEffect(() => { if (window.lucide) window.lucide.createIcons(); });
  const [layout, setLayout] = useState(() => localStorage.getItem('mayam-projects-layout') || 'grid');
  const [projects, setProjects] = useState(null);
  useEffect(() => { localStorage.setItem('mayam-projects-layout', layout); }, [layout]);

  useEffect(() => {
    sb.from('agent_projects')
      .select('*')
      .eq('service', 'consultoria')
      .eq('status', 'published')
      .order('sort_order', { ascending: true })
      .then(({ data }) => {
        if (data && data.length > 0)
          setProjects(data.map((p, idx) => ({ ...p, idx, metricLabel: p.metric_label || '' })));
        else
          setProjects(makeProjects('consultoria', 6));
      });
  }, []);

  const displayProjects = projects || makeProjects('consultoria', 6);

  return (
    <>
      <Header active="consultoria.html" />
      <main>
        <ServiceHero
          eyebrow="Consultoría estratégica"
          icon="compass"
          title="Antes de automatizar,"
          titleAccent="ordenamos."
          description="Acompañamos al comité directivo a decidir qué SÍ y qué NO automatizar con IA. Diagnóstico operativo, evaluación de stack, gobernanza de datos y hoja de ruta con métricas claras."
          bullets={[
            'Diagnóstico operativo (4–8 semanas)',
            'Evaluación técnica y ética de proveedores',
            'Roadmap a 12–18 meses con quick wins',
            'Gobernanza de datos y marco ISO/IEC 42001',
            'Acompañamiento al patrocinador ejecutivo',
          ]}
        />
        <ServiceFeatures
          title="Decisiones, no diapositivas"
          subtitle="Salimos de cada engagement con casos priorizados, presupuesto, responsables y la primera implementación arrancando."
          features={[
            { icon: 'search', title: 'Discovery', desc: 'Entrevistas a líderes, observación en piso y mapa de procesos. Encontramos el costo real de cada fricción.' },
            { icon: 'list-checks', title: 'Priorización', desc: 'Matriz impacto vs esfuerzo, validada con finanzas. Defendemos cada caso con cifras.' },
            { icon: 'shield', title: 'Ética y gobernanza', desc: 'Política de uso, redacción de PII, trazabilidad y aprobaciones. Lo que pide ISO 42001 y NOM aplicables.' },
            { icon: 'package', title: 'Stack', desc: 'Evaluamos OpenAI, Anthropic, Google, Microsoft, open-source. Recomendamos por caso, no por contrato.' },
            { icon: 'route', title: 'Roadmap', desc: 'Plan a 12–18 meses con olas, dependencias, riesgos y un dashboard ejecutivo de avance.' },
            { icon: 'handshake', title: 'Acompañamiento', desc: 'Vamos al comité, hablamos con TI, defendemos el caso ante CFO. No solo entregamos un PDF.' },
          ]}
        />
        <ProjectsSection projects={displayProjects} layout={layout} setLayout={setLayout} />
      </main>
      <Footer />
      <WhatsAppFloat />
      <AdminProjectPanel sb={sb} service="consultoria" onProjectsChange={setProjects} />
    </>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Page />);
</script>
</body>
</html>
